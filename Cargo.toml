[workspace]
members = [
    "crates/img-tools",
    "crates/rustyshelf-core",
    "crates/rustyshelf",
]
resolver = "2"

[workspace.package]
version = "0.5.5"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.97.1"

# Bevy is unusably slow unoptimised; the app's own code stays quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# (no debug symbols in what ships)
strip = true
