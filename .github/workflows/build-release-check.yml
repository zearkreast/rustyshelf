# RustyShelf: the check that runs on every push to rustyshelf. It reads the pushed commit's message
# (scripts/release-version.js) and decides one of four things, all of them about the native app (crates/):
#   none     a normal commit: this run finishes here, nothing else runs
#   build    "For build…" → calls build.yml: the Windows, Linux and Android builds, kept as the run's downloads
#   release  "For version A.B.C" → calls release.yml: the same builds, then the latest release vA.B.C
#   alpha    "For alpha" → calls alpha.yml: Windows and Android, as a prerelease vA.B.C-alpha.N
# A.B.C is the Cargo workspace's version; a build is A.B.C.DDDD, DDDD the build of it. Android's versionCode grows
# with every build. The Electron app's builds are on the archive/electron branch.
name: Build/release check

on:
  push:
    branches: [rustyshelf]

# the called workflows inherit these: the release job needs to write (create the release)
permissions:
  contents: write

concurrency:
  group: release # (one at a time, none cancelled: each build counts from the release before it)
  cancel-in-progress: false

jobs:
  check:
    name: Read the commit message
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.v.outputs.kind }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      semver: ${{ steps.v.outputs.semver }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide what this commit is for
        id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          git fetch --tags --force --quiet
          git tag -l 'v*' > "$RUNNER_TEMP/tags.txt"
          CARGO=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          node scripts/release-version.js "$MSG" "$RUNNER_TEMP/tags.txt" "" "$CARGO" | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        env:
          KIND: ${{ steps.v.outputs.kind }}
          VERSION: ${{ steps.v.outputs.version }}
          REASON: ${{ steps.v.outputs.reason }}
        run: |
          case "$KIND" in
            release) echo "### Release RustyShelf $VERSION: builds, then the release" >> "$GITHUB_STEP_SUMMARY" ;;
            build) echo "### Build RustyShelf $VERSION: builds, kept as this run's downloads" >> "$GITHUB_STEP_SUMMARY" ;;
            alpha) echo "### Alpha of the native app $VERSION: the Windows and Android builds, then a prerelease" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "### Nothing to build: $REASON" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  build:
    name: Build
    needs: check
    if: needs.check.outputs.kind == 'build'
    uses: ./.github/workflows/build.yml
    secrets: inherit # (RustyShelf issue 26: the ScreenScraper developer login)
    with:
      version: ${{ needs.check.outputs.version }}
      code: ${{ needs.check.outputs.code }}

  release:
    name: Release
    needs: check
    if: needs.check.outputs.kind == 'release'
    uses: ./.github/workflows/release.yml
    secrets: inherit # (the ScreenScraper developer login)
    with:
      version: ${{ needs.check.outputs.version }}
      code: ${{ needs.check.outputs.code }}
      tag: ${{ needs.check.outputs.tag }}
      notes: ${{ github.event.head_commit.message }}

  alpha:
    name: Alpha
    needs: check
    if: needs.check.outputs.kind == 'alpha'
    uses: ./.github/workflows/alpha.yml
    secrets: inherit # (the ScreenScraper developer login)
    with:
      version: ${{ needs.check.outputs.version }}
      tag: ${{ needs.check.outputs.tag }}
      notes: ${{ github.event.head_commit.message }}
