# An alpha of the native Rust app (crates/rustyshelf): built for Windows and Android, published as a GitHub prerelease
# vA.B.C-alpha.N, never as the latest release (that stays the Electron app's). Called by build-release-check.yml for a
# "For alpha" commit.
name: Alpha

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      notes:
        type: string
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows exe (native app)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: alpha-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpha-windows-
      - name: Build
        shell: bash
        # (issue 26) RustyShelf's own ScreenScraper developer login, from the repository's secrets, built in (never in
        # git or the log); without the secrets the build goes on and ScreenScraper needs the player's own developer login
        env:
          RUSTYSHELF_SS_DEV_ID: ${{ secrets.SS_DEV_ID }}
          RUSTYSHELF_SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
          RUSTYSHELF_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked -p rustyshelf
      - name: Name it for the release
        shell: bash
        run: |
          mkdir out
          cp target/release/rustyshelf.exe "out/RustyShelf-native-${{ inputs.version }}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-windows
          path: out/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK (native app)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: alpha-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: alpha-android-
      - name: Build the app's library
        env:
          RUSTYSHELF_SS_DEV_ID: ${{ secrets.SS_DEV_ID }}
          RUSTYSHELF_SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
          RUSTYSHELF_VERSION: ${{ inputs.version }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 26 -o crates/rustyshelf/android/app/src/main/jniLibs build --release --locked -p rustyshelf --lib
      # (signed with the debug key, as the Capacitor app's APK is: installable by hand)
      - name: Build the APK
        working-directory: crates/rustyshelf/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PrsVersionName="${{ inputs.version }}" -PrsVersionCode="${{ github.run_number }}"
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/RustyShelf-native-${{ inputs.version }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the prerelease
    needs: [windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "RustyShelf native $VERSION (alpha)" --notes-file notes.md --prerelease --latest=false
