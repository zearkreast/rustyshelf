[package]
name = "rustyshelf-core"
description = "RustyShelf without a screen: settings, consoles, game folders, box art, launching"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11"

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
