[package]
name = "rustyshelf-core"
description = "RustyShelf without a screen: settings, consoles, game folders, box art, launching"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
regex = "1.11"
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
md-5 = "0.11.0"
crc32fast = "1"
getrandom = "0.2"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs"] }
quick-xml = "0.42"
rustfft = "6"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
resvg = { version = "0.45", default-features = false }
aes-gcm = "0.10"
miniz_oxide = "0.9.1"
rustyshelf-imgtools = { version = "1.3.0", path = "../img-tools" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3"
