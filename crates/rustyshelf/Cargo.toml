[package]
name = "rustyshelf"
description = "RustyShelf: a TV-style 3D box-art launcher for emulators"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rustyshelf-core = { path = "../rustyshelf-core" }
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "png", "jpeg", "webp", "x11", "wayland", "gamepad", "default_font", "tonemapping_luts", "bevy_audio", "wav"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
arboard = { version = "3.7", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["mp3", "flac", "vorbis", "wav", "mp4"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target."cfg(windows)".build-dependencies]
embed-resource = "3.0.12"
