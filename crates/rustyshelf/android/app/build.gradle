plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.rustyshelf.native_'
    compileSdk 36
    defaultConfig {
        // its own id: it installs beside the Capacitor app (android-app/) while the rewrite catches up
        applicationId 'io.github.rustyshelf.native'
        minSdk 26
        targetSdk 36
        versionCode((project.findProperty('rsVersionCode') ?: '1') as int)
        versionName project.findProperty('rsVersionName') ?: '0.6.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    // RustyShelf's own key, from the CI's secrets: every release signed alike, so each installs over the one before
    def keystore = System.getenv('RS_KEYSTORE')
    signingConfigs {
        if (keystore) {
            rustyshelf {
                storeFile file(keystore)
                storePassword System.getenv('RS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RS_KEY_ALIAS')
                keyPassword System.getenv('RS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.rustyshelf
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // keep in sync with the android-activity crate Bevy uses (its README names the GameActivity it's built for)
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
}
